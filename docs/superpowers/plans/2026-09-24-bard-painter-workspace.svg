<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960">
<style>text{font-family:Segoe UI,Malgun Gothic,sans-serif;fill:#e2e8f0;font-size:17px}.title{font-size:26px;font-weight:700}.heading{font-size:20px;font-weight:600}.note{font-size:15px;fill:#aab8d0}rect{rx:9}</style>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26334a" stroke-width="0.5"/></pattern></defs>
<rect width="1480" height="960" fill="#0f172a"/><rect width="1480" height="960" fill="url(#grid)"/>
<text x="30" y="43" class="title">바드페인터 작업 화면 블루프린트</text>
<text x="30" y="73" class="note">장면 확정 → 프롬프트 대화와 편집 → 이미지 생성 → 원하는 위치에 삽입 / 여러 챗의 이미지는 갤러리에서 관리</text>
<rect x="30" y="100" width="320" height="715" fill="#162238" stroke="#a78bfa"/>
<text x="48" y="137" class="heading">왼쪽: 캐릭터 디스플레이</text>
<text x="48" y="174">[아이콘] [화면] [에셋] [갤러리]</text>
<text x="48" y="222">챗: 모두 ▾ / 생성 순서</text>
<text x="48" y="252" class="note">챗 이름별 / 삭제한 챗</text>
<rect x="49" y="280" width="84" height="90" fill="#34405a"/><rect x="144" y="280" width="84" height="90" fill="#34405a"/><rect x="239" y="280" width="84" height="90" fill="#34405a"/>
<rect x="49" y="382" width="84" height="90" fill="#34405a"/><rect x="144" y="382" width="84" height="90" fill="#34405a"/><rect x="239" y="382" width="84" height="90" fill="#34405a"/>
<text x="48" y="510">[이전] 1 / 12 [다음]</text>
<text x="48" y="542" class="note">24장 고정 페이지 / 썸네일 로딩</text>
<text x="48" y="585">[이 챗의 그림 모두 삭제]</text>
<rect x="47" y="618" width="286" height="170" fill="#23283f" stroke="#a78bfa"/>
<text x="64" y="650" class="heading">클릭하면 확대</text>
<text x="64" y="685">메인 / 인물별 프롬프트 [복사]</text>
<text x="64" y="716">모델 / 시드 / 이미지 크기</text>
<text x="64" y="749" class="note">선택한 한 장의 원본과 정보만 로드</text>
<rect x="372" y="100" width="652" height="715" fill="#162238" stroke="#22d3ee"/>
<text x="392" y="138" class="heading">바드페인터   [화풍] [캐릭터] [생성 설정]</text>
<text x="392" y="170" class="note">현재 화풍 / 이미지 크기 / 모델 요약</text>
<rect x="390" y="192" width="616" height="103" fill="#19334a" stroke="#22d3ee"/>
<text x="408" y="224" class="heading">1. 그릴 장면</text><text x="408" y="256">확정한 선택문 유지 / 새 선택 → [장면 바꾸기]</text>
<rect x="390" y="312" width="616" height="182" fill="#173831" stroke="#34d399"/>
<text x="408" y="345" class="heading">2. 프롬프트 초안</text><text x="408" y="378">메인: 장면과 구도 / 네거티브 접기</text>
<text x="408" y="414">인물 A ▾   [캐릭터 불러오기] [의상 불러오기] [더 보기]</text>
<text x="408" y="451">단일 편집창: 외형 / 의상과 상태 / 포즈</text>
<rect x="390" y="511" width="616" height="123" fill="#173831" stroke="#34d399"/>
<text x="408" y="544" class="heading">프롬프트 대화</text><text x="408" y="577">“구도를 더 가깝게, 표정은 차분하게”</text>
<text x="408" y="610">[프롬프트 작성 / 초안 개선]   [이전 초안으로]</text>
<rect x="390" y="651" width="616" height="145" fill="#19334a" stroke="#22d3ee"/>
<text x="408" y="684" class="heading">3. [이미지 생성] → 현재 결과 한 장</text>
<text x="408" y="720">본문에서 새로 선택 → [아래에 삽입]</text>
<text x="408" y="755">[갤러리 열기] 모든 이미지와 생성 기록 관리</text>
<rect x="1045" y="100" width="406" height="211" fill="#342b21" stroke="#fbbf24"/>
<text x="1063" y="136" class="heading">툴바로 여는 관리 창</text><text x="1063" y="173">화풍: 선택과 사용자 프리셋 편집</text>
<text x="1063" y="207">캐릭터: 인물 폴더 / 외형 / 의상</text><text x="1063" y="241">생성 설정: 컨텍스트 / 모델 / 크기</text>
<text x="1063" y="279" class="note">닫기와 Esc / 초점 복귀 / 편집 상태 유지</text>
<rect x="1045" y="330" width="406" height="194" fill="#23283f" stroke="#a78bfa"/>
<text x="1063" y="367" class="heading">이미지와 챗의 수명 분리</text><text x="1063" y="404">챗 삭제 후에도 이미지와 생성 정보 보존</text>
<text x="1063" y="438">없는 챗 ID → 삭제한 챗 분류</text><text x="1063" y="472">이미지 일괄 삭제는 범위와 수량 확인</text>
<rect x="1045" y="544" width="406" height="271" fill="#342b21" stroke="#fb923c"/>
<text x="1063" y="580" class="heading">독립 UX 평가 반영</text><text x="1063" y="617">그릴 장면 ≠ 삽입 위치</text>
<text x="1063" y="651">새 선택으로 기존 초안 자동 교체 금지</text><text x="1063" y="685">프롬프트 요청과 유료 생성 분리</text>
<text x="1063" y="719">선택한 인물 편집창만 노출</text><text x="1063" y="753">글자 위치가 없으면 선택 메시지 아래</text>
<text x="1063" y="787" class="note">모바일: 툴바 줄바꿈 / 이미지 우선</text>
<text x="30" y="858" class="heading">검증할 사용 흐름</text>
<text x="30" y="891">장면 A로 초안 작성 → 장면 B 선택 → 그림 삽입 → 초안은 A 유지 / 챗 삭제 후에도 그림과 프롬프트 유지</text>
<text x="30" y="926" class="note">합성 예시만 사용합니다. 개인 프리셋이나 실제 메시지를 설계도와 테스트에 넣지 않습니다.</text>
</svg>
